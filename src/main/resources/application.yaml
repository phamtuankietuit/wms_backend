spring:
  application:
    name: wms-backend
  datasource:
      url: ${DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    user:
      name: admin
      password: 123456

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-secret-key-to-at-least-32-characters}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
spring:
  application:
    name: wms-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  datasource:
      url: ${DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:12MB}
  mail:
    name: ${MAIL_NAME:WMS}
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
        mail:
            smtp:
                auth: true
                starttls:
                    enable: true
                    required: true
app:
  api:
    prefix: ${API_PREFIX:/api}
  server:
    url: ${SERVER_URL:http://localhost:8080}
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-secret-key-to-at-least-32-characters}
      expiration: ${JWT_EXPIRATION:900000} # 15 minutes
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days
      reset-expiration: ${JWT_RESET_EXPIRATION:600000} # 10 minutes
      onboarding-reset-expiration: ${JWT_ONBOARDING_RESET_EXPIRATION:86400000} # 1 day
  client:
    url: ${CLIENT_URL:http://localhost:3000}
  sequences:
    stock-transaction-seq-name: ${SEQUENCE_STOCK_TRANSACTION:stock_transaction_seq}
    import-prefix: ${SEQUENCE_IMPORT_PREFIX:IMP}
    export-prefix: ${SEQUENCE_EXPORT_PREFIX:EXP}
    adjustment-prefix: ${SEQUENCE_ADJUSTMENT_PREFIX:ADJ}
    user-seq-name: ${SEQUENCE_USER:user_seq}
    user-prefix: ${SEQUENCE_USER_PREFIX:USR}
    padding-length: ${SEQUENCE_PADDING_LENGTH:6}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    secure: ${CLOUDINARY_SECURE:true}
    folder: ${CLOUDINARY_FOLDER:wms}
    max-file-size-bytes: ${CLOUDINARY_MAX_FILE_SIZE_BYTES:10485760}
    product-image:
      max-width: ${CLOUDINARY_PRODUCT_IMAGE_MAX_WIDTH:1600}
      max-height: ${CLOUDINARY_PRODUCT_IMAGE_MAX_HEIGHT:1600}
      quality: "${CLOUDINARY_PRODUCT_IMAGE_QUALITY:auto:good}"
    variant-image:
      max-width: ${CLOUDINARY_VARIANT_IMAGE_MAX_WIDTH:1200}
      max-height: ${CLOUDINARY_VARIANT_IMAGE_MAX_HEIGHT:1200}
      quality: "${CLOUDINARY_VARIANT_IMAGE_QUALITY:auto:good}"
    user-avatar:
      max-width: ${CLOUDINARY_USER_AVATAR_MAX_WIDTH:512}
      max-height: ${CLOUDINARY_USER_AVATAR_MAX_HEIGHT:512}
      quality: "${CLOUDINARY_USER_AVATAR_QUALITY:auto:good}"
    allowed-image-content-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/gif
    allowed-video-content-types:
      - video/mp4
      - video/webm
      - video/quicktime
    allowed-raw-content-types:
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/csv
      - application/csv
      - application/vnd.ms-excel
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.ms-powerpoint
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
      - text/plain

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO

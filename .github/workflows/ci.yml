name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  maven-test:
    name: Maven Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: wms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/wms_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-secret-key-with-at-least-32-characters
      MAIL_USERNAME: ci@example.com
      MAIL_PASSWORD: ci-mail-password
      SERVER_URL: http://localhost:8080
      CLIENT_URL: http://localhost:3000
      COOKIE_SECURE: "false"
      SPRING_PROFILES_ACTIVE: dev
      CLOUDINARY_CLOUD_NAME: ci-cloud
      CLOUDINARY_API_KEY: ci-api-key
      CLOUDINARY_API_SECRET: ci-api-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run all tests
        run: ./mvnw -B -ntp clean test

  maven-verify:
    name: Maven Verify
    runs-on: ubuntu-latest
    needs: maven-test

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: wms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/wms_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-secret-key-with-at-least-32-characters
      MAIL_USERNAME: ci@example.com
      MAIL_PASSWORD: ci-mail-password
      SERVER_URL: http://localhost:8080
      CLIENT_URL: http://localhost:3000
      COOKIE_SECURE: "false"
      SPRING_PROFILES_ACTIVE: dev
      CLOUDINARY_CLOUD_NAME: ci-cloud
      CLOUDINARY_API_KEY: ci-api-key
      CLOUDINARY_API_SECRET: ci-api-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run Maven verify
        run: ./mvnw -B -ntp clean verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: wms-backend-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: maven-verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: wms-backend:ci
